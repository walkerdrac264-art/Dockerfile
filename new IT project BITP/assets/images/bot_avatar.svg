<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="botBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e36" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="botShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="50" cy="50" r="48" fill="url(#botBg)" stroke="url(#goldAcc)" stroke-width="3" filter="url(#botShadow)" />
  
  <!-- Robot Head / Helmet -->
  <rect x="25" y="28" width="50" height="42" rx="14" fill="#0f2b4c" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Antenna -->
  <rect x="48" y="16" width="4" height="12" fill="#fbbf24" />
  <circle cx="50" cy="14" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Ear Caps / Headset -->
  <rect x="19" y="38" width="6" height="20" rx="3" fill="#fbbf24" />
  <rect x="75" y="38" width="6" height="20" rx="3" fill="#fbbf24" />
  
  <!-- Digital Visor -->
  <rect x="31" y="36" width="38" height="18" rx="8" fill="#06111f" stroke="#0284c7" stroke-width="1.5" />
  
  <!-- Glowing Cyan Eyes -->
  <circle cx="42" cy="45" r="4.5" fill="#00f2fe" />
  <circle cx="43" cy="44" r="1.5" fill="#ffffff" />
  
  <circle cx="58" cy="45" r="4.5" fill="#00f2fe" />
  <circle cx="59" cy="44" r="1.5" fill="#ffffff" />
  
  <!-- Friendly Smile Line -->
  <path d="M 40 59 Q 50 66 60 59" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Little Football Badge on Chest -->
  <circle cx="50" cy="80" r="10" fill="#ffffff" stroke="#0b1e36" stroke-width="1.5" />
  <!-- Small Pentagon -->
  <polygon points="50,76 53,78 52,82 48,82 47,78" fill="#0b1e36" />
</svg>
