<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e36" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Shield Outline -->
  <path d="M 100 10 L 180 35 C 180 130 150 195 100 230 C 50 195 20 130 20 35 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)" />
  
  <!-- Inner Shield Inset -->
  <path d="M 100 22 L 168 44 C 168 124 142 182 100 214 C 58 182 32 124 32 44 Z" 
        fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />

  <!-- River Wave Motif -->
  <path d="M 36 120 Q 70 95 100 120 T 164 120 L 164 140 Q 130 120 100 140 T 36 140 Z" 
        fill="url(#waveGrad)" opacity="0.85" />
  <path d="M 40 142 Q 70 122 100 142 T 160 142 L 160 156 Q 130 140 100 156 T 40 156 Z" 
        fill="url(#waveGrad)" opacity="0.5" />

  <!-- Stylized Football in center -->
  <g transform="translate(100, 80)">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#0b1e36" stroke-width="2" />
    <!-- Football Pentagon & lines -->
    <polygon points="0,-12 11,-4 7,10 -7,10 -11,-4" fill="#0b1e36" />
    <line x1="0" y1="-12" x2="0" y2="-28" stroke="#0b1e36" stroke-width="2" />
    <line x1="11" y1="-4" x2="26" y2="-10" stroke="#0b1e36" stroke-width="2" />
    <line x1="7" y1="10" x2="18" y2="22" stroke="#0b1e36" stroke-width="2" />
    <line x1="-7" y1="10" x2="-18" y2="22" stroke="#0b1e36" stroke-width="2" />
    <line x1="-11" y1="-4" x2="-26" y2="-10" stroke="#0b1e36" stroke-width="2" />
  </g>

  <!-- Club Monogram / Header -->
  <text x="100" y="44" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="3">RIVERSIDE</text>
  <text x="100" y="180" fill="url(#goldGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="2">FC</text>
  <text x="100" y="196" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" text-anchor="middle" letter-spacing="1">EST. 1994</text>
  
  <!-- 3 Stars on top -->
  <g fill="url(#goldGrad)" transform="translate(100, -2)">
    <polygon points="0,0 2,5 7,5 3,8 5,13 0,10 -5,13 -3,8 -7,5 -2,5" transform="translate(0, 15) scale(0.7)"/>
    <polygon points="0,0 2,5 7,5 3,8 5,13 0,10 -5,13 -3,8 -7,5 -2,5" transform="translate(-16, 17) scale(0.55)"/>
    <polygon points="0,0 2,5 7,5 3,8 5,13 0,10 -5,13 -3,8 -7,5 -2,5" transform="translate(16, 17) scale(0.55)"/>
  </g>
</svg>
